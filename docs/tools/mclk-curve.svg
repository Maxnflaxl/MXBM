<text x="74" y="28" font-size="15" font-weight="bold" fill="#0b0b0b">The 5001 MHz memory rung pays MXBM below ~173 W; lolMiner can only follow it to ~126 W</text>
<text x="74" y="48" font-size="11" fill="#52514e">RTX 4070 Ti SUPER, 2026-07-31, one evening: ABBA-bracketed arms per cap, memory clock sampled during every arm (no rung refused),</text>
<text x="74" y="63" font-size="11" fill="#52514e">MXBM measured in the miner loop with draw from the card's energy counter. Each miner's sol/s is its OWN definition; the watts are one instrument.</text>
<text x="74" y="78" font-size="11" fill="#52514e">The flat right-hand traces are each design's DRAM roofline on the reduced interface: 13.0 GB/solve plateaus at 43.6 sol/s, 17.7 GB/solve at 34.</text>
