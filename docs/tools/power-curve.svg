<text x="74" y="28" font-size="15" font-weight="bold" fill="#0b0b0b">At the same cap, MXBM leads on speed and efficiency between 212 W and 257 W -- and only there</text>
<text x="74" y="48" font-size="11" fill="#52514e">RTX 4070 Ti SUPER, one session, runs interleaved and alternating. Caps set externally with nvidia-smi so neither miner's own</text>
<text x="74" y="63" font-size="11" fill="#52514e">overclock code is a variable; power sampled from NVML for both, never from a miner's own stats block. 2 repeats per point.</text>
<text x="74" y="78" font-size="11" fill="#52514e">Each miner's sol/s is its OWN definition and the two are not strictly comparable. The watts are one instrument for both.</text>
