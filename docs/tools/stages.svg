<text x="62" y="440" font-size="10" fill="#52514e">Every stage draws the board limit — there is no single kernel to fix for power. The spread is 6.3 W, from entry_scatter at 282.9 W to terminal at 289.2 W.</text>
<text x="62" y="456" font-size="10" fill="#898781">Per-stage figures from benchmarks/stage_power.sh, which replays one stage many times inside a real solve; they sum to 28.31 ms against the table's 28.04 ms total, a +1.0 % attribution residual.</text>
