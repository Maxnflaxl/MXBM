<line x1="222.6" y1="298" x2="222.6" y2="326" stroke="#c3c2b7" stroke-width="1"/>
<text x="222.6" y="334" font-size="10" fill="#52514e" text-anchor="middle">round 1 · 5.02 ms · 17.2 %</text>
