<text x="537.7" y="370" font-size="11" font-weight="bold" fill="#0b0b0b" text-anchor="middle">round 2 + round 3 = 56 % of the solve</text>
<text x="62" y="440" font-size="10" fill="#52514e">Every stage draws the board limit — there is no single kernel to fix for power. The one dip is round 3 at 281.2 W, the most bandwidth-bound stage (4.55 GB).</text>
<text x="62" y="456" font-size="10" fill="#898781">Per-stage figures from benchmarks/stage_power.sh, which replays one stage many times inside a real solve; they sum to 31.68 ms against the table's 31.67 ms total, a +0.0 % attribution residual.</text>
