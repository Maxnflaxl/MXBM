<text x="62" y="30" font-size="15" font-weight="bold" fill="#0b0b0b">Where one BeamHash III solve spends its time and energy</text>
<text x="62" y="48" font-size="11" fill="#52514e">Board power through a single 29.3 ms solve. Segment width is time, height is power — so segment AREA is energy.</text>
