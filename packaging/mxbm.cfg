#
# MXBM flat configuration file
# uncomment a line (remove the starting "#") to set an option in this file
# The available options are the same as on the command line
# See readme.txt, or run ./mxbm --help, for the full list
#
# Load it with:   ./mxbm --config mxbm.cfg
#
# For more than one rig or pool set, use the JSON form instead --
# user_config.json in this archive -- which holds several named profiles and
# supports failover pool lists. Load that with: ./mxbm --json --profile RIG1
# (--json selects the JSON file; --profile alone loads nothing)
#

################################################################################
# Required options
################################################################################

# ALGO = BEAM-III
# POOL = beam.herominers.com:1130
# USER = YOUR_BEAM_SBBS_ADDRESS_HERE.worker1

################################################################################
# Comfort functions
################################################################################

# APIPORT = 8080
# SHORTSTATS = 15
# LONGSTATS = 60
# NOCOLOR = 1

################################################################################
# Overclocking -- all of these need root (on Windows: an Administrator
# prompt), and are restored when MXBM exits
################################################################################
#
#   PL    board power limit, watts
#   CCLK  locked core clock, MHz      COFF  core V/F offset, MHz (signed)
#   MCLK  locked memory clock, MHz    MOFF  memory V/F offset, MHz (signed)
#   FAN   fan target, percent
#
# Start with PL alone. It is the only one measured end to end; see readme.txt
# for the window measured on the reference card. The rest shift the V/F curve
# and are yours to validate on your own card -- set too high they can overheat
# or hang it, or leave it in a state only a reboot clears. Move one knob at a
# time, and compare against what the card reports from a fresh boot.
#
# https://github.com/maxnflaxl/MXBM/blob/master/docs/overclocking.md covers what
# each one does, and how to tell instability apart from an algorithmic failure
# rate.
#
# PL = 220
# CCLK = 2600
# MCLK = 10251
# COFF = 0
# MOFF = 0
# FAN = 70
